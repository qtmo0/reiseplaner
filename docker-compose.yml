services:
  app:
    image: ghcr.io/qtmo0/reiseplaner:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DB_PATH: /data/reiseplaner.db
      APP_TOKEN: ${APP_TOKEN:?APP_TOKEN fehlt in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-5-5}
      CLAUDE_EFFORT: ${CLAUDE_EFFORT:-medium}
      APP_CONTACT: ${APP_CONTACT:-}
    volumes:
      - ./data:/data
    ports:
      - "${APP_PORT:-8090}:8000"
