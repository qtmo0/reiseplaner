<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5f1" id="theme-color">
  <!-- The map draws under the status bar and Dynamic Island; controls keep clear via safe-area insets -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Städtetrip">
  <title>Städtetrip</title>
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/vendor/leaflet.css">
  <link rel="stylesheet" href="/styles.css">
  <script>
    // Set the theme before first paint
    (function () {
      var pref = localStorage.getItem("theme") || "auto";
      var dark = pref === "dark" || (pref === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/vendor/leaflet.js"></script>
  <script src="/app.js"></script>
</body>
</html>
